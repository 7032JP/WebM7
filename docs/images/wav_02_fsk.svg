<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="840" height="200">
  <title>FSK の概念図。2400Hz の音がビット 0、1200Hz の音がビット 1 を表す</title>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="840" height="200" fill="#ffffff"/>
  <text x="420" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f2328" text-anchor="middle">音の高さでビットを表す（FSK）</text>

  <!-- short cycles = bit 0 -->
  <path d="M80,110 q 10,-44 20,0 q 10,44 20,0 q 10,-44 20,0 q 10,44 20,0 q 10,-44 20,0 q 10,44 20,0"
        fill="none" stroke="#0969da" stroke-width="2"/>
  <text x="140" y="150" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0969da" text-anchor="middle">2400 Hz（短い周期）</text>
  <text x="140" y="170" font-family="sans-serif" font-size="13" fill="#57606a" text-anchor="middle">= ビット 0</text>

  <!-- long cycles = bit 1 -->
  <path d="M420,110 q 20,-44 40,0 q 20,44 40,0 q 20,-44 40,0 q 20,44 40,0 q 20,-44 40,0 q 20,44 40,0"
        fill="none" stroke="#bc4c00" stroke-width="2"/>
  <text x="540" y="150" font-family="sans-serif" font-size="14" font-weight="bold" fill="#bc4c00" text-anchor="middle">1200 Hz（長い周期）</text>
  <text x="540" y="170" font-family="sans-serif" font-size="13" fill="#57606a" text-anchor="middle">= ビット 1</text>
</svg>
