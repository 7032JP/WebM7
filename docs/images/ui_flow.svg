<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340">
  <title>操作の流れ。ROM の供給元、電源を入れる、ディスクを入れる、起動モードを選んでリセットの 4 段</title>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#57606a"/>
    </marker>
  </defs>
  <!-- (1) -->
  <rect x="140" y="20" width="520" height="52" rx="8" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/>
  <circle cx="172" cy="46" r="12" fill="#0969da"/>
  <text x="172" y="51" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="200" y="52" font-family="sans-serif" font-size="16" fill="#1f2328">ROM の供給元（既定は同梱互換）</text>
  <line x1="400" y1="72" x2="400" y2="100" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>
  <!-- (2) -->
  <rect x="140" y="102" width="520" height="52" rx="8" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/>
  <circle cx="172" cy="128" r="12" fill="#0969da"/>
  <text x="172" y="133" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="200" y="134" font-family="sans-serif" font-size="16" fill="#1f2328">電源を入れる</text>
  <line x1="400" y1="154" x2="400" y2="182" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>
  <!-- (3) -->
  <rect x="140" y="184" width="520" height="52" rx="8" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/>
  <circle cx="172" cy="210" r="12" fill="#0969da"/>
  <text x="172" y="215" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="200" y="216" font-family="sans-serif" font-size="16" fill="#1f2328">ディスクを入れる（ドライブをクリック）</text>
  <line x1="400" y1="236" x2="400" y2="264" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>
  <!-- (4) -->
  <rect x="140" y="266" width="520" height="52" rx="8" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/>
  <circle cx="172" cy="292" r="12" fill="#0969da"/>
  <text x="172" y="297" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="200" y="298" font-family="sans-serif" font-size="16" fill="#1f2328">起動モードを選んでリセット</text>
</svg>
