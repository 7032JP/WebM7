  <text x="504" y="96" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="start">押したキーの event.code を表示（キー表示）</text>
  <circle cx="486" cy="132" r="10" fill="#0969da"/>
  <text x="486" y="136" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <text x="504" y="136" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="start">FM-7 キーボード図。クリックすると入力、カスタマイズ中は割</text>
