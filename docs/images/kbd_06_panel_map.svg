  <circle cx="486" cy="269" r="10" fill="#bc4c00"/>
  <text x="486" y="273" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
  <text x="504" y="273" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="start">「カスタマイズ開始」。押すと「カスタマイズ終了」に変わる</text>
  <circle cx="486" cy="309" r="10" fill="#bc4c00"/>
  <text x="486" y="313" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text>
  <text x="504" y="313" font-family="sans-serif" font-size="12" fill="#1f2328" text-anchor="start">「リセット」。割当と BREAK キーを既定へ戻す</text>
