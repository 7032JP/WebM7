<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 498" width="880" height="498">
  <title>機種別の ROM 構成の図。全機種共通の ROM に、FM77AV 系、FM77AV40EX/SX の ROM が加わる。印は必須 (起動モードで決まる BASIC時必須・DOS時必須を含む)・任意・本体搭載。KANJI.ROM は FM-77 と FM77AV 系で本体搭載、KANJI2.ROM は FM77AV40 と FM77AV40EX/SX で本体搭載。FM77AV20 と FM77AV20EX の第 2 水準漢字は日本語拡張カードを足したときだけ</title>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="498" fill="#ffffff"/>
  <text x="440" y="28" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f2328" text-anchor="middle">機種別の ROM 構成</text>
  <!-- 凡例 -->
  <rect x="53" y="49" width="34" height="17" rx="3" fill="#fff5f5" stroke="#cf222e" stroke-width="1.2"/><text x="70" y="62" font-family="sans-serif" font-size="12" font-weight="bold" fill="#cf222e" text-anchor="middle">必須</text>
  <text x="93" y="62" font-family="sans-serif" font-size="13" fill="#1f2328">電源を入れるのに必要</text>
  <rect x="241" y="49" width="34" height="17" rx="3" fill="#ffffff" stroke="#0969da" stroke-width="1.2"/><text x="258" y="62" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0969da" text-anchor="middle">任意</text>
  <text x="281" y="62" font-family="sans-serif" font-size="13" fill="#1f2328">無ければ同梱互換で補う</text>
  <rect x="442" y="49" width="58" height="17" rx="3" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2"/><text x="471" y="62" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a7f37" text-anchor="middle">本体搭載</text>
  <text x="506" y="62" font-family="sans-serif" font-size="13" fill="#1f2328">本体に搭載の漢字 ROM（無ければ同梱互換で補う）</text>

  <!-- FM-7 基本セット -->
  <rect x="40" y="312" width="800" height="120" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="60" y="338" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0969da">FM-7 / FM-77 の ROM（FBASIC30.ROM / SUBSYS_C.ROM は全機種で必須）</text>
  <rect x="60" y="351" width="34" height="17" rx="3" fill="#fff5f5" stroke="#cf222e" stroke-width="1.2"/><text x="77" y="364" font-family="sans-serif" font-size="12" font-weight="bold" fill="#cf222e" text-anchor="middle">必須</text>
  <text x="100" y="364" font-family="sans-serif" font-size="14" fill="#1f2328">FBASIC30.ROM ／ SUBSYS_C.ROM</text>
  <rect x="60" y="375" width="80" height="17" rx="3" fill="#fff5f5" stroke="#cf222e" stroke-width="1.2"/><text x="100" y="388" font-family="sans-serif" font-size="12" font-weight="bold" fill="#cf222e" text-anchor="middle">BASIC時必須</text>
  <text x="146" y="388" font-family="sans-serif" font-size="14" fill="#1f2328">BOOT_BAS.ROM</text>
  <rect x="268" y="375" width="70" height="17" rx="3" fill="#fff5f5" stroke="#cf222e" stroke-width="1.2"/><text x="303" y="388" font-family="sans-serif" font-size="12" font-weight="bold" fill="#cf222e" text-anchor="middle">DOS時必須</text>
  <text x="344" y="388" font-family="sans-serif" font-size="14" fill="#1f2328">BOOT_DOS.ROM　FM-7 / FM-77 のみ。選んでいない起動モードの行は任意</text>
  <rect x="60" y="399" width="34" height="17" rx="3" fill="#ffffff" stroke="#0969da" stroke-width="1.2"/><text x="77" y="412" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0969da" text-anchor="middle">任意</text>
  <text x="100" y="412" font-family="sans-serif" font-size="14" fill="#1f2328">KANJI.ROM（FM-7。漢字 ROM カード相当）</text>
  <rect x="412" y="399" width="58" height="17" rx="3" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2"/><text x="441" y="412" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a7f37" text-anchor="middle">本体搭載</text>
  <text x="476" y="412" font-family="sans-serif" font-size="14" fill="#1f2328">KANJI.ROM（FM-77）</text>

  <!-- FM77AV 追加 -->
  <rect x="80" y="192" width="760" height="100" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="100" y="218" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a7f37">FM77AV 系（FM77AV / AV20 / AV40 / AV20EX）追加分</text>
  <rect x="100" y="231" width="34" height="17" rx="3" fill="#fff5f5" stroke="#cf222e" stroke-width="1.2"/><text x="117" y="244" font-family="sans-serif" font-size="12" font-weight="bold" fill="#cf222e" text-anchor="middle">必須</text>
  <text x="140" y="244" font-family="sans-serif" font-size="14" fill="#1f2328">INITIATE.ROM ／ SUBSYS_A.ROM ・ SUBSYS_B.ROM（Drive 0 にディスクがあるとき）</text>
  <rect x="100" y="255" width="34" height="17" rx="3" fill="#ffffff" stroke="#0969da" stroke-width="1.2"/><text x="117" y="268" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0969da" text-anchor="middle">任意</text>
  <text x="140" y="268" font-family="sans-serif" font-size="14" fill="#1f2328">SUBSYSCG.ROM</text>
  <rect x="267" y="255" width="58" height="17" rx="3" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2"/><text x="296" y="268" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a7f37" text-anchor="middle">本体搭載</text>
  <text x="331" y="268" font-family="sans-serif" font-size="14" fill="#1f2328">KANJI.ROM　　BOOT_BAS.ROM / BOOT_DOS.ROM は不要</text>

  <!-- FM77AV40EX 追加 -->
  <rect x="120" y="92" width="720" height="80" rx="8" fill="#ffebe9" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="140" y="114" font-family="sans-serif" font-size="15" font-weight="bold" fill="#bc4c00">FM77AV40EX/SX 追加分</text>
  <rect x="140" y="125" width="34" height="17" rx="3" fill="#ffffff" stroke="#0969da" stroke-width="1.2"/><text x="157" y="138" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0969da" text-anchor="middle">任意</text>
  <text x="180" y="138" font-family="sans-serif" font-size="14" fill="#1f2328">EXTSUB.ROM ／ DICROM.ROM</text>
  <rect x="403" y="125" width="58" height="17" rx="3" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2"/><text x="432" y="138" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a7f37" text-anchor="middle">本体搭載</text>
  <text x="467" y="138" font-family="sans-serif" font-size="14" fill="#1f2328">KANJI2.ROM</text>
  <text x="140" y="161" font-family="sans-serif" font-size="13" fill="#57606a">KANJI2.ROM は FM77AV40 でも本体搭載（FM77AV20 / FM77AV20EX は日本語拡張カードを足したときだけ）</text>

  <!-- 積み増しの矢印 -->
  <line x1="60" y1="308" x2="60" y2="242" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="100" y1="188" x2="100" y2="142" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>

  <text x="54" y="278" font-family="sans-serif" font-size="12" fill="#57606a" text-anchor="end">＋追加</text>
  <text x="94" y="162" font-family="sans-serif" font-size="12" fill="#57606a" text-anchor="end">＋追加</text>

  <!-- 注記 -->
  <rect x="40" y="442" width="800" height="40" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="440" y="467" font-family="sans-serif" font-size="13" fill="#1f2328" text-anchor="middle">機種を切り替えると、その機種で使う ROM の行が ROM Files パネルに追加されます（必須／BASIC時必須／DOS時必須／任意／本体搭載の印付き）</text>
</svg>
