<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 486" width="880" height="486">
  <title>機種別の ROM 構成の図。全機種共通の ROM に、FM77AV 系、FM77AV40EX の ROM が加わる</title>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="486" fill="#ffffff"/>
  <text x="440" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f2328" text-anchor="middle">機種別の ROM 構成（必須＝その機種の ROM 構成に含まれる ROM）</text>

  <!-- FM-7 基本セット -->
  <rect x="40" y="300" width="800" height="120" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="60" y="326" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0969da">FM-7 / FM-77 の ROM（FBASIC30.ROM / SUBSYS_C.ROM は全機種で必須）</text>
  <text x="60" y="352" font-family="sans-serif" font-size="14" fill="#1f2328">必須: FBASIC30.ROM ／ SUBSYS_C.ROM</text>
  <text x="60" y="376" font-family="sans-serif" font-size="14" fill="#1f2328">必須（FM-7 系のみ）: BOOT_BAS.ROM（Boot Mode: BASIC） ／ BOOT_DOS.ROM（Boot Mode: DOS）</text>
  <text x="60" y="400" font-family="sans-serif" font-size="14" fill="#1f2328">任意: KANJI.ROM（FM-7 / FM-77 では漢字表示ソフト用）</text>

  <!-- FM77AV 追加 -->
  <rect x="80" y="180" width="760" height="100" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="100" y="206" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a7f37">FM77AV 系（FM77AV / AV20 / AV40 / AV20EX）追加分</text>
  <text x="100" y="232" font-family="sans-serif" font-size="14" fill="#1f2328">必須: INITIATE.ROM ／ SUBSYS_A.ROM ／ SUBSYS_B.ROM ／ SUBSYSCG.ROM ／ KANJI.ROM</text>
  <text x="100" y="256" font-family="sans-serif" font-size="14" fill="#1f2328">BOOT_BAS.ROM / BOOT_DOS.ROM は不要</text>

  <!-- FM77AV40EX 追加 -->
  <rect x="120" y="80" width="720" height="80" rx="8" fill="#ffebe9" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="140" y="106" font-family="sans-serif" font-size="15" font-weight="bold" fill="#bc4c00">FM77AV40EX 追加分</text>
  <text x="140" y="134" font-family="sans-serif" font-size="14" fill="#1f2328">必須: EXTSUB.ROM ／ DICROM.ROM ／ KANJI2.ROM</text>

  <!-- 積み増しの矢印 -->
  <line x1="60" y1="296" x2="60" y2="230" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="100" y1="176" x2="100" y2="130" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>

  <text x="48" y="266" font-family="sans-serif" font-size="12" fill="#57606a">＋追加</text>
  <text x="106" y="158" font-family="sans-serif" font-size="12" fill="#57606a">＋追加</text>

  <!-- 注記 -->
  <rect x="40" y="430" width="800" height="40" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="440" y="455" font-family="sans-serif" font-size="13" fill="#1f2328" text-anchor="middle">機種を切り替えると、ROM Files パネルに必要な行が自動で表示されます（必須／任意バッジ付き）</text>
</svg>
