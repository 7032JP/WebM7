  <text x="365.6" y="430" font-family="sans-serif" font-size="14" fill="#6b2e00" text-anchor="middle" font-weight="bold">.</text>
  <text x="471.59999999999997" y="190" font-family="sans-serif" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="bold">Cursor → Ten Key</text>
  <text x="471.59999999999997" y="208" font-family="sans-serif" font-size="11.5" fill="#57606a" text-anchor="start">Options パネルでチェックを入れると</text>
  <text x="471.59999999999997" y="226" font-family="sans-serif" font-size="11.5" fill="#57606a" text-anchor="start">カーソルキーがテンキーとして働きます。</text>
  <text x="471.59999999999997" y="244" font-family="sans-serif" font-size="11.5" fill="#0969da" text-anchor="start">↑ → テンキー 8</text>
  <text x="471.59999999999997" y="262" font-family="sans-serif" font-size="11.5" fill="#0969da" text-anchor="start">↓ → テンキー 2</text>
  <text x="471.59999999999997" y="280" font-family="sans-serif" font-size="11.5" fill="#0969da" text-anchor="start">← → テンキー 4</text>
  <text x="471.59999999999997" y="298" font-family="sans-serif" font-size="11.5" fill="#0969da" text-anchor="start">→ → テンキー 6</text>
  <text x="471.59999999999997" y="334" font-family="sans-serif" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="bold">FM-7 のテンキーの「=」は</text>
  <text x="471.59999999999997" y="352" font-family="sans-serif" font-size="11.5" fill="#57606a" text-anchor="start">一般の PC のテンキーに無いため、</text>
  <text x="471.59999999999997" y="370" font-family="sans-serif" font-size="11.5" fill="#57606a" text-anchor="start">キーカスタマイズで割り当てます。</text>
  <text x="471.59999999999997" y="406" font-family="sans-serif" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="bold">EL / CLS / DUP には現在</text>
  <text x="471.59999999999997" y="424" font-family="sans-serif" font-size="11.5" fill="#57606a" text-anchor="start">入力コードを割り当てていません。</text>
