  <text x="421.6" y="376" font-family="sans-serif" font-size="14" fill="#6b2e00" text-anchor="middle" font-weight="bold">RT</text>
  <rect x="227.6" y="392" width="52" height="50" rx="5" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.2"/>
  <text x="253.6" y="408" font-family="sans-serif" font-size="11" fill="#57606a" text-anchor="middle">0</text>
  <text x="253.6" y="430" font-family="sans-serif" font-size="14" fill="#6b2e00" text-anchor="middle" font-weight="bold">0</text>
  <rect x="339.6" y="392" width="52" height="50" rx="5" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.2"/>
