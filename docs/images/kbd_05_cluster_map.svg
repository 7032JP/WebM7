  <text x="206" y="122" font-family="sans-serif" font-size="11" fill="#57606a" text-anchor="start">Pause は常に BREAK の予備として有効</text>
  <rect x="16" y="166" width="441.59999999999997" height="286" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <rect x="26" y="176" width="52" height="50" rx="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/>
