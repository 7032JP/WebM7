<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 412" width="860" height="412">
  <title>キーアサインを変更する手順の図解</title>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="412" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
  <text x="430" y="30" font-family="sans-serif" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="bold">キーアサインを変更する手順</text>
  <rect x="30" y="62" width="246" height="74" rx="8" fill="#f6f8fa" stroke="#0969da" stroke-width="1.4"/>
  <circle cx="50" cy="82" r="12" fill="#0969da"/>
  <text x="50" y="86" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <text x="70" y="86" font-family="sans-serif" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="bold">Keyboard パネルを開く</text>
  <text x="44" y="108" font-family="sans-serif" font-size="11" fill="#57606a" text-anchor="start">ツールバー 2 行目の Keyboard ボタン</text>
  <line x1="280" y1="99" x2="300" y2="99" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="306" y="62" width="246" height="74" rx="8" fill="#f6f8fa" stroke="#0969da" stroke-width="1.4"/>
  <circle cx="326" cy="82" r="12" fill="#0969da"/>
  <text x="326" y="86" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <text x="346" y="86" font-family="sans-serif" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="bold">配列と種別を選ぶ</text>
  <text x="320" y="108" font-family="sans-serif" font-size="11" fill="#57606a" text-anchor="start">日本語配列 (JIS) / 英語配列 (US)</text>
  <text x="320" y="124" font-family="sans-serif" font-size="11" fill="#57606a" text-anchor="start">フルキー / テンキーレス / コンパクト</text>
  <line x1="556" y1="99" x2="576" y2="99" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="582" y="62" width="246" height="74" rx="8" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1.4"/>
  <circle cx="602" cy="82" r="12" fill="#1a7f37"/>
  <text x="602" y="86" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <text x="622" y="86" font-family="sans-serif" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="bold">「カスタマイズ開始」を押す</text>
  <text x="596" y="108" font-family="sans-serif" font-size="11" fill="#57606a" text-anchor="start">ボタンが「カスタマイズ終了」に変わる</text>
  <line x1="705" y1="140" x2="153" y2="140" stroke="#57606a" stroke-width="1.5"/>
  <line x1="153" y1="140" x2="153" y2="200" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="30" y="206" width="246" height="74" rx="8" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1.4"/>
  <circle cx="50" cy="226" r="12" fill="#1a7f37"/>
  <text x="50" y="230" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
  <text x="70" y="230" font-family="sans-serif" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="bold">割当先の FM-7 キーをクリック</text>
  <text x="44" y="252" font-family="sans-serif" font-size="11" fill="#57606a" text-anchor="start">キーボード図の中から選ぶ（BRK も選べる）</text>
  <line x1="280" y1="243" x2="300" y2="243" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="306" y="206" width="246" height="74" rx="8" fill="#f6f8fa" stroke="#bc4c00" stroke-width="1.4"/>
  <circle cx="326" cy="226" r="12" fill="#bc4c00"/>
  <text x="326" y="230" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
  <text x="346" y="230" font-family="sans-serif" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="bold">割り当てたい物理キーを押す</text>
  <text x="320" y="252" font-family="sans-serif" font-size="11" fill="#57606a" text-anchor="start">割当が保存され、次のキーを選べる状態に戻る</text>
  <line x1="556" y1="243" x2="576" y2="243" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="582" y="206" width="246" height="74" rx="8" fill="#f6f8fa" stroke="#bc4c00" stroke-width="1.4"/>
  <circle cx="602" cy="226" r="12" fill="#bc4c00"/>
  <text x="602" y="230" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text>
  <text x="622" y="230" font-family="sans-serif" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="bold">「カスタマイズ終了」を押す</text>
  <text x="596" y="252" font-family="sans-serif" font-size="11" fill="#57606a" text-anchor="start">通常の入力に戻る</text>
  <rect x="30" y="308" width="800" height="92" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
  <text x="44" y="330" font-family="sans-serif" font-size="12.5" fill="#0a3069" text-anchor="start" font-weight="bold">覚えておくこと</text>
  <text x="44" y="352" font-family="sans-serif" font-size="11" fill="#0a3069" text-anchor="start">・Shift / Ctrl / Alt / Win などの修飾キーは割り当てできません（「修飾キーは割り当てできません」と表示されます）。</text>
  <text x="44" y="369" font-family="sans-serif" font-size="11" fill="#0a3069" text-anchor="start">・割当はブラウザに保存され、次に開いたときも残ります。「リセット」で BREAK キーごと既定に戻ります。</text>
  <text x="44" y="386" font-family="sans-serif" font-size="11" fill="#0a3069" text-anchor="start">・BRK キーを選んだときだけ BREAK（割込線）の割当になり、ほかのキーの割当とは別に保存されます。</text>
</svg>
