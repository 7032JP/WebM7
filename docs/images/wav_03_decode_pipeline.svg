<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 450" width="840" height="450">
  <title>WAV の読み取りの仕組み。録音状態に合った方式を自動で選び、結果をステータスに表示する</title>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="840" height="450" fill="#ffffff"/>
  <text x="420" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f2328" text-anchor="middle">WAV が読み取られる仕組み</text>

  <!-- input -->
  <rect x="250" y="50" width="340" height="48" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="420" y="79" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f2328" text-anchor="middle">読み込んだ WAV（音声波形）</text>

  <line x1="340" y1="98" x2="230" y2="128" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="500" y1="98" x2="610" y2="128" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- method 1 -->
  <rect x="60" y="130" width="340" height="104" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="230" y="156" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0969da" text-anchor="middle">方式 1: 読み取って信号を整える</text>
  <text x="230" y="178" font-family="sans-serif" font-size="12" fill="#57606a" text-anchor="middle">波形からデータを読み取り、</text>
  <text x="230" y="196" font-family="sans-serif" font-size="12" fill="#57606a" text-anchor="middle">再生用の信号を作り直す</text>

  <!-- method 2 -->
  <rect x="440" y="130" width="340" height="104" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
  <text x="610" y="156" font-family="sans-serif" font-size="14" font-weight="bold" fill="#8250df" text-anchor="middle">方式 2: そのまま読む</text>
  <text x="610" y="178" font-family="sans-serif" font-size="12" fill="#57606a" text-anchor="middle">波形をそのまま読み取る</text>

  <line x1="230" y1="234" x2="340" y2="264" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="610" y1="234" x2="500" y2="264" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- checksum -->
  <rect x="180" y="266" width="480" height="52" rx="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="420" y="290" font-family="sans-serif" font-size="14" font-weight="bold" fill="#bc4c00" text-anchor="middle">チェックサムで結果を確かめる</text>
  <text x="420" y="310" font-family="sans-serif" font-size="12" fill="#57606a" text-anchor="middle">正しく読めたブロック数を数える</text>

  <line x1="420" y1="318" x2="420" y2="342" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- result -->
  <rect x="140" y="344" width="560" height="58" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="420" y="368" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1a7f37" text-anchor="middle">結果の良い方を自動で採用</text>
  <text x="420" y="390" font-family="sans-serif" font-size="12" fill="#57606a" text-anchor="middle">数えたブロックがあれば正常ブロック数を表示（BAD はチェックサムの不一致の数）</text>
</svg>
